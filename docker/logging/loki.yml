auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: ${SCA4D_LOKI_STORAGE_MODE}
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
  filesystem:
    directory: /loki/chunks
  aws:
    endpoint: ${SCA4D_LOKI_S3_ENDPOINT}
    region: ${SCA4D_LOKI_S3_REGION}
    bucketnames: ${SCA4D_LOKI_S3_BUCKET}
    access_key_id: ${SCA4D_LOKI_S3_ACCESS_KEY}
    secret_access_key: ${SCA4D_LOKI_S3_SECRET_KEY}
    s3forcepathstyle: true
    insecure: ${SCA4D_LOKI_S3_INSECURE}

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: ${SCA4D_LOKI_STORAGE_MODE}

limits_config:
  allow_structured_metadata: true
  retention_period: ${SCA4D_LOKI_RETENTION}

analytics:
  reporting_enabled: false
