services:
  postgresql:
    image: postgres:17-alpine
    container_name: sca4dj-postgresql
    environment:
      POSTGRES_DB: ${SCA4DJ_DB_NAME:-sca4dj}
      POSTGRES_USER: ${SCA4DJ_DB_USERNAME:-sca4dj}
      POSTGRES_PASSWORD: ${SCA4DJ_DB_PASSWORD:-sca4dj}
      TZ: ${SCA4DJ_DB_TIMEZONE:-Asia/Shanghai}
      PGTZ: ${SCA4DJ_DB_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${SCA4DJ_POSTGRES_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - ./docker-data/postgresql:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - timezone=${SCA4DJ_DB_TIMEZONE:-Asia/Shanghai}

  redis:
    image: redis:7.2.14-alpine
    container_name: sca4dj-redis
    ports:
      - "${SCA4DJ_REDIS_BIND:-127.0.0.1:6379}:6379"
    volumes:
      - ./docker-data/redis:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sca4dj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SCA4DJ_RABBITMQ_USERNAME:-sca4dj}
      RABBITMQ_DEFAULT_PASS: ${SCA4DJ_RABBITMQ_PASSWORD:-sca4dj}
      RABBITMQ_DEFAULT_VHOST: ${SCA4DJ_RABBITMQ_VHOST:-/}
    ports:
      - "${SCA4DJ_RABBITMQ_AMQP_BIND:-127.0.0.1:5672}:5672"
      - "${SCA4DJ_RABBITMQ_STOMP_BIND:-127.0.0.1:61613}:61613"
      - "${SCA4DJ_RABBITMQ_MANAGEMENT_BIND:-127.0.0.1:15672}:15672"
    volumes:
      - ./docker-data/rabbitmq:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sca4dj-minio
    environment:
      MINIO_ROOT_USER: ${SCA4DJ_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SCA4DJ_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${SCA4DJ_MINIO_API_BIND:-127.0.0.1:9000}:9000"
      - "${SCA4DJ_MINIO_CONSOLE_BIND:-127.0.0.1:9001}:9001"
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"

  mailpit:
    image: axllent/mailpit:v1.30.4
    container_name: sca4dj-mailpit
    ports:
      - "${SCA4DJ_MAILPIT_SMTP_BIND:-127.0.0.1:1025}:1025"
      - "${SCA4DJ_MAILPIT_UI_BIND:-127.0.0.1:8025}:8025"
    volumes:
      - ./docker-data/mailpit:/data
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
