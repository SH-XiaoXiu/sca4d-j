spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ${SCA4DJ_GATEWAY_APPLICATION_NAME:sca4d-gateway}

server:
  port: ${SCA4DJ_GATEWAY_SERVER_PORT:8088}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

sca4dj:
  gateway:
    upstreams-file: ${SCA4DJ_GATEWAY_UPSTREAMS_FILE:config/gateway-upstreams.yml}
    reload-interval-millis: ${SCA4DJ_GATEWAY_RELOAD_INTERVAL_MILLIS:5000}
    health-interval-millis: ${SCA4DJ_GATEWAY_HEALTH_INTERVAL_MILLIS:5000}
