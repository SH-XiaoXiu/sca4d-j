services:
  logging-data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - ./docker-data/logging/loki:/loki
      - ./docker-data/logging/grafana:/grafana
    command:
      - /bin/sh
      - -ec
      - |
        chown 10001:10001 /loki
        chown 472:0 /grafana
    restart: "no"

  logging-loki:
    image: grafana/loki:3.7.4
    depends_on:
      logging-data-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      SCA4DJ_LOKI_STORAGE_MODE: ${SCA4DJ_LOKI_STORAGE_MODE:-filesystem}
      SCA4DJ_LOKI_RETENTION: ${SCA4DJ_LOKI_RETENTION:-720h}
      SCA4DJ_LOKI_S3_ENDPOINT: ${SCA4DJ_LOKI_S3_ENDPOINT:-http://minio:9000}
      SCA4DJ_LOKI_S3_REGION: ${SCA4DJ_LOKI_S3_REGION:-us-east-1}
      SCA4DJ_LOKI_S3_BUCKET: ${SCA4DJ_LOKI_S3_BUCKET:-loki-logs}
      SCA4DJ_LOKI_S3_ACCESS_KEY: ${SCA4DJ_LOKI_S3_ACCESS_KEY:-}
      SCA4DJ_LOKI_S3_SECRET_KEY: ${SCA4DJ_LOKI_S3_SECRET_KEY:-}
      SCA4DJ_LOKI_S3_INSECURE: ${SCA4DJ_LOKI_S3_INSECURE:-true}
    volumes:
      - ./docker/logging/loki.yml:/etc/loki/loki.yml:ro
      - ./docker-data/logging/loki:/loki
    ports:
      - "${SCA4DJ_LOKI_BIND:-127.0.0.1:3100}:3100"
    networks:
      - logging-backend
      - default
    restart: unless-stopped

  logging-grafana:
    image: grafana/grafana:13.1.0
    depends_on:
      - logging-loki
    environment:
      GF_SECURITY_ADMIN_USER: ${SCA4DJ_GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SCA4DJ_GRAFANA_ADMIN_PASSWORD:?set SCA4DJ_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${SCA4DJ_GRAFANA_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - ./docker/logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker-data/logging/grafana:/var/lib/grafana
    networks:
      - logging-backend
      - default
    restart: unless-stopped

networks:
  logging-backend:
    internal: true
