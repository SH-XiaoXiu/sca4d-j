spring:
  config:
    import:
      - optional:file:.env/application.env[.properties]
      - optional:file:.env/database.env[.properties]
      - optional:file:.env/redis.env[.properties]
      - optional:file:.env/rabbitmq.env[.properties]
      - optional:file:.env/web-realtime.env[.properties]
      - optional:file:.env/iam.env[.properties]
      - optional:file:.env/auth.env[.properties]
      - optional:file:.env/notification.env[.properties]
      - optional:file:.env/storage.env[.properties]
      - optional:file:.env/iot.env[.properties]
      - optional:file:.env/iot-database.env[.properties]
      - optional:file:../../.env/application.env[.properties]
      - optional:file:../../.env/database.env[.properties]
      - optional:file:../../.env/redis.env[.properties]
      - optional:file:../../.env/rabbitmq.env[.properties]
      - optional:file:../../.env/web-realtime.env[.properties]
      - optional:file:../../.env/iam.env[.properties]
      - optional:file:../../.env/auth.env[.properties]
      - optional:file:../../.env/notification.env[.properties]
      - optional:file:../../.env/storage.env[.properties]
      - optional:file:../../.env/iot.env[.properties]
      - optional:file:../../.env/iot-database.env[.properties]

mybatis:
  configuration:
    # 默认不输出 SQL 参数和结果；业务 DEBUG 日志仍由各 Service 记录。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: ${sca4dj.core.openapi.enabled:true}
  swagger-ui:
    enabled: ${sca4dj.core.openapi.enabled:true}

sca4dj:
  core:
    openapi:
      enabled: ${SCA4DJ_CORE_OPENAPI_ENABLED:true}
  auth:
    excluded-paths:
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
