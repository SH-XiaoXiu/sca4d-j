mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: ${sca4dj.core.openapi.enabled:true}
  swagger-ui:
    enabled: ${sca4dj.core.openapi.enabled:true}

sca4dj:
  core:
    openapi:
      enabled: ${SCA4D_CORE_OPENAPI_ENABLED:true}
  auth:
    excluded-paths:
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
